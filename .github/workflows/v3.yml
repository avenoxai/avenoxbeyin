name: V3 offline platform contracts

on:
  pull_request:
    paths:
      - 'template/.claude/scripts/beyin_v3*.py'
      - 'scripts/*v3*.py'
      - 'scripts/beyin_entry.py'
      - 'template/.agents/skills/**'
      - 'tests/v3_*.py'
      - 'tests/fixtures/v3/**'
      - '.github/workflows/v3.yml'
  push:
    branches: [main, 'codex/v3-foundation']
    paths:
      - 'template/.claude/scripts/beyin_v3*.py'
      - 'scripts/*v3*.py'
      - 'scripts/beyin_entry.py'
      - 'template/.agents/skills/**'
      - 'tests/v3_*.py'
      - 'tests/fixtures/v3/**'
      - '.github/workflows/v3.yml'

permissions:
  contents: read

jobs:
  stdlib-contracts:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Windows runs the same suite in 8-14 minutes against 3-4 elsewhere; keep hangs fast to spot there.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      BEYIN_V3_NO_SPAWN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Offline source, runtime, lifecycle and skill contracts
        run: python -m unittest discover -s tests -p "v3_*test.py"
      - name: Frozen development and holdout retrieval gates
        run: python scripts/evaluate_v3.py
