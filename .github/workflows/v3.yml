name: V3 offline platform contracts

on:
  pull_request:
    paths:
      - 'template/.claude/scripts/beyin_v3*.py'
      - 'scripts/*v3*.py'
      - 'scripts/beyin_entry.py'
      - 'scripts/audit_text_encoding.py'
      - 'template/.agents/skills/**'
      - 'tests/v3_*.py'
      - 'tests/fixtures/v3/**'
      - '.github/workflows/v3.yml'
  push:
    branches: [main, 'codex/v3-foundation']
    paths:
      - 'template/.claude/scripts/beyin_v3*.py'
      - 'scripts/*v3*.py'
      - 'scripts/beyin_entry.py'
      - 'scripts/audit_text_encoding.py'
      - 'template/.agents/skills/**'
      - 'tests/v3_*.py'
      - 'tests/fixtures/v3/**'
      - '.github/workflows/v3.yml'

permissions:
  contents: read

jobs:
  stdlib-contracts:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Full checks exceeded 15 minutes on macOS and 40 on Windows 3.11.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      BEYIN_V3_NO_SPAWN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify natural locale with UTF-8 mode disabled
        env:
          PYTHONUTF8: '0'
        run: python -c "import locale, sys; print('utf8_mode=', sys.flags.utf8_mode, 'locale=', locale.getpreferredencoding(False)); assert sys.flags.utf8_mode == 0"
      - name: Explicit text encoding gate
        run: python scripts/audit_text_encoding.py
      - name: Encoding boundary regressions with strict warnings
        env:
          PYTHONUTF8: '0'
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s tests -p "v3_encoding_contract_test.py"
      - name: Natural-locale onboarding with strict warnings
        env:
          PYTHONUTF8: '0'
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s tests -p "v3_workspace_onboarding_test.py"
      - name: Offline source, runtime, lifecycle and skill contracts
        run: python -m unittest discover -s tests -p "v3_*test.py"
      - name: Frozen development and holdout retrieval gates
        run: python scripts/evaluate_v3.py
