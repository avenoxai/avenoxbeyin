name: Exact queue evidence 776

# Temporary evidence carrier; never merge. Tests immutable queue, not this PR.
on:
  pull_request:
    paths:
      - '.github/workflows/landing-queue-776.yml'

permissions:
  contents: read

jobs:
  exact-landing:
    name: Queue 776 / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      BEYIN_V3_NO_SPAWN: '1'
    steps:
      - name: Check out immutable base, not this workflow PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: avenoxai/avenoxbeyin
          ref: 8f9f7281d9f9901f770c3a52d158416bc0442a0b
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Reconstruct and assert exact landing tree
        working-directory: candidate
        env:
          EXPECTED_TREE: ef961aa9800b66d25b23bc5e9c06d4ad12bb150d
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8f9f7281d9f9901f770c3a52d158416bc0442a0b
          git config user.name 'Landing validation'
          git config user.email 'landing-validation@users.noreply.github.com'
          git fetch --no-tags origin 662848e5a7d2268b8b2612e021f0f84145f6e4c6
          git merge --no-ff --no-edit 662848e5a7d2268b8b2612e021f0f84145f6e4c6
          git fetch --no-tags origin 54a806b4829dffbf8f971085d5cfc9d1ea6ba5d4
          git merge --no-ff --no-edit 54a806b4829dffbf8f971085d5cfc9d1ea6ba5d4
          git fetch --no-tags origin 00c868fb2ae49f80e102c9eac2c7fa5b4db8a32a
          git merge --no-ff --no-edit 00c868fb2ae49f80e102c9eac2c7fa5b4db8a32a
          git fetch --no-tags origin ddb7f4f010ad4ced468d9fdd25a82f3e40bb8037
          git merge --no-ff --no-edit ddb7f4f010ad4ced468d9fdd25a82f3e40bb8037
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/landing-queue-776.yml
          git show -s --format='candidate_commit=%H%ncandidate_tree=%T%nparents=%P'
          python --version
      - name: Install and require PDF and media test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg
          command -v pdftotext
          command -v ffmpeg
          command -v ffprobe
          pdftotext -v
          ffmpeg -version
          ffprobe -version
      - name: Complete unfiltered V3 contracts
        working-directory: candidate
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/landing-home"
          export XDG_STATE_HOME="$RUNNER_TEMP/landing-state"
          mkdir -p "$HOME" "$XDG_STATE_HOME"
          python -m unittest discover -s tests -p 'v3_*test.py'
      - name: Frozen development and holdout retrieval gates
        working-directory: candidate
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/eval-home"
          export XDG_STATE_HOME="$RUNNER_TEMP/eval-state"
          mkdir -p "$HOME" "$XDG_STATE_HOME"
          python scripts/evaluate_v3.py
      - name: Verify candidate remained unchanged
        working-directory: candidate
        env:
          EXPECTED_TREE: ef961aa9800b66d25b23bc5e9c06d4ad12bb150d
        run: |
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
