name: Exact queue evidence 5d8f510

# Temporary evidence carrier; never merge. Tests immutable queue, not this PR.
on:
  pull_request:
    paths:
      - '.github/workflows/landing-queue-5d8f510.yml'

permissions:
  contents: read

jobs:
  exact-landing:
    name: Queue 5d8f510 / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      BEYIN_V3_NO_SPAWN: '1'
    steps:
      - name: Check out immutable base, not this workflow PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: avenoxai/avenoxbeyin
          ref: 21cd4bc6aee88f1b471c5ed832b29ece3f47687b
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Reconstruct and assert exact landing tree
        working-directory: candidate
        env:
          EXPECTED_TREE: 5d8f5106313002f79387774fed0578df0f3fe02d
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 21cd4bc6aee88f1b471c5ed832b29ece3f47687b
          git config user.name 'Landing validation'
          git config user.email 'landing-validation@users.noreply.github.com'
          git fetch --no-tags origin 320dd111f8c9bd620d62247fc9763d3ae9002c37
          git merge --no-ff --no-edit 320dd111f8c9bd620d62247fc9763d3ae9002c37
          git fetch --no-tags origin 970381889abaf32de5b9d386ffcb2fe45c384751
          git merge --no-ff --no-edit 970381889abaf32de5b9d386ffcb2fe45c384751
          git fetch --no-tags origin 7745f0d25a5c5359c3d4b80b64ade598e5098f4c
          git merge --no-ff --no-edit 7745f0d25a5c5359c3d4b80b64ade598e5098f4c
          git fetch --no-tags origin 9c339f9eb0733a12752d98f49d221e97cbfc9000
          git merge --no-ff --no-edit 9c339f9eb0733a12752d98f49d221e97cbfc9000
          git fetch --no-tags origin ef628fa4a2676f6b57f031d4328b6ae33babbdef
          git merge --no-ff --no-edit ef628fa4a2676f6b57f031d4328b6ae33babbdef
          git fetch --no-tags origin 927c86ca328a04c5cd572847085a4393466c48c9
          git merge --no-ff --no-edit 927c86ca328a04c5cd572847085a4393466c48c9
          git fetch --no-tags origin 0030a156700e5ec03715691afaa31764affc2f79
          git merge --no-ff --no-edit 0030a156700e5ec03715691afaa31764affc2f79
          git fetch --no-tags origin 5058efafa07d9082691b2609baf6ce3143d6f41e
          git merge --no-ff --no-edit 5058efafa07d9082691b2609baf6ce3143d6f41e
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/landing-queue-5d8f510.yml
          git show -s --format='candidate_commit=%H%ncandidate_tree=%T%nparents=%P'
          python --version
      - name: Complete unfiltered V3 contracts
        working-directory: candidate
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/landing-home"
          export XDG_STATE_HOME="$RUNNER_TEMP/landing-state"
          mkdir -p "$HOME" "$XDG_STATE_HOME"
          python -m unittest discover -s tests -p 'v3_*test.py'
      - name: Frozen development and holdout retrieval gates
        working-directory: candidate
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/eval-home"
          export XDG_STATE_HOME="$RUNNER_TEMP/eval-state"
          mkdir -p "$HOME" "$XDG_STATE_HOME"
          python scripts/evaluate_v3.py
      - name: Verify candidate remained unchanged
        working-directory: candidate
        env:
          EXPECTED_TREE: 5d8f5106313002f79387774fed0578df0f3fe02d
        run: |
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
