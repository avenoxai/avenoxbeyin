name: Exact PR750 landing evidence

# Temporary evidence carrier; never merge. Tests immutable queue, not this PR.
on:
  pull_request:
    paths:
      - '.github/workflows/landing-pr750.yml'

permissions:
  contents: read

jobs:
  exact-landing:
    name: Exact PR750 / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      BEYIN_V3_NO_SPAWN: '1'
    steps:
      - name: Check out immutable base, not this workflow PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: avenoxai/avenoxbeyin
          ref: 4de8635aa8bb7bb2b4988511d7948f6dc15af2da
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Assert exact candidate before tests
        working-directory: candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 4de8635aa8bb7bb2b4988511d7948f6dc15af2da
          test "$(git rev-parse HEAD^{tree})" = d6bd40f8a14601d081975b2d1ae6551f3108050e
          test -z "$(git status --porcelain)"
          git show -s --format='candidate_commit=%H%ncandidate_tree=%T%nparents=%P'
      - name: Install and require PDF and media test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg
          command -v pdftotext
          command -v ffmpeg
          command -v ffprobe
          pdftotext -v
          ffmpeg -version
          ffprobe -version
      - name: Complete unfiltered V3 contracts
        working-directory: candidate
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/landing-home"
          export XDG_STATE_HOME="$RUNNER_TEMP/landing-state"
          mkdir -p "$HOME" "$XDG_STATE_HOME"
          python -m unittest discover -s tests -p 'v3_*test.py'
      - name: Frozen development and holdout retrieval gates
        working-directory: candidate
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/eval-home"
          export XDG_STATE_HOME="$RUNNER_TEMP/eval-state"
          mkdir -p "$HOME" "$XDG_STATE_HOME"
          python scripts/evaluate_v3.py
      - name: Verify candidate remained unchanged
        working-directory: candidate
        env:
          EXPECTED_TREE: d6bd40f8a14601d081975b2d1ae6551f3108050e
        run: |
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
