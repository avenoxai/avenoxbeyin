name: Temporary Windows PDF diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      BEYIN_V3_NO_SPAWN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Poppler
        shell: pwsh
        run: ./scripts/setup_v3_poppler.ps1
      - name: Trace actual installed PDF extraction
        run: python scripts/diagnose_windows_pdf.py
      - name: Existing real PDF integration assertions
        run: python -m unittest discover -s tests -p "v3_yakala_pdf_warning_test.py"
