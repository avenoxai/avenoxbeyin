name: Exact landing evidence 729-730

# Temporary evidence carrier; never merge. Tests immutable queue, not this PR.
on:
  pull_request:
    paths:
      - '.github/workflows/landing-729-730.yml'

permissions:
  contents: read

jobs:
  exact-landing:
    name: Landing ${{ matrix.stage }} / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        stage: ['729', '730']
        include:
          - stage: '729'
            tree: 4acbd8d4497d66c1c4415dd58dce8871616b9900
          - stage: '730'
            tree: 0a0e10b705154b66a93e9ee643bab3e516aac6c8
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      BEYIN_V3_NO_SPAWN: '1'
    steps:
      - name: Check out immutable base, not this workflow PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: avenoxai/avenoxbeyin
          ref: 70a8ea1ef6d90653bbbbaab4ebe9eecb7af9e844
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Reconstruct and assert exact landing tree
        working-directory: candidate
        env:
          EXPECTED_TREE: ${{ matrix.tree }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 70a8ea1ef6d90653bbbbaab4ebe9eecb7af9e844
          git config user.name 'Landing validation'
          git config user.email 'landing-validation@users.noreply.github.com'
          git fetch --no-tags origin ee7edf5af2107faf8d499577fc1a5a22f033bbb4
          git merge --no-ff --no-edit ee7edf5af2107faf8d499577fc1a5a22f033bbb4
          if [ "${{ matrix.stage }}" = "730" ]; then
            git fetch --no-tags origin 9424f02727c744c9e1c87371f4d51bffb513cd06
            git merge --no-ff --no-edit 9424f02727c744c9e1c87371f4d51bffb513cd06
          fi
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          test ! -e .github/workflows/landing-729-730.yml
          git show -s --format='candidate_commit=%H%ncandidate_tree=%T%nparents=%P'
          python --version
      - name: Install and require PDF and media test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg
          command -v pdftotext
          command -v ffmpeg
          command -v ffprobe
          pdftotext -v
          ffmpeg -version
          ffprobe -version
      - name: Complete unfiltered V3 contracts
        working-directory: candidate
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/landing-home"
          export XDG_STATE_HOME="$RUNNER_TEMP/landing-state"
          mkdir -p "$HOME" "$XDG_STATE_HOME"
          python -m unittest discover -s tests -p 'v3_*test.py'
      - name: Frozen development and holdout retrieval gates
        working-directory: candidate
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/eval-home"
          export XDG_STATE_HOME="$RUNNER_TEMP/eval-state"
          mkdir -p "$HOME" "$XDG_STATE_HOME"
          python scripts/evaluate_v3.py
      - name: Verify candidate remained unchanged
        working-directory: candidate
        env:
          EXPECTED_TREE: ${{ matrix.tree }}
        run: |
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
