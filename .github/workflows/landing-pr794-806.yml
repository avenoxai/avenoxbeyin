name: Exact PR794 + PR806 landing evidence

# Temporary evidence carrier; never merge. Tests immutable queue, not this PR.
on:
  pull_request:
    paths:
      - '.github/workflows/landing-pr794-806.yml'

permissions:
  contents: read

jobs:
  exact-landing:
    name: Exact PR794 + PR806 / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
      BEYIN_V3_NO_SPAWN: '1'
    steps:
      - name: Check out immutable base, not this workflow PR
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: avenoxai/avenoxbeyin
          ref: 60e1c2f4e91a8490c120ca4ced7eb9a44741f0ae
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Assert exact candidate before tests
        working-directory: candidate
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 60e1c2f4e91a8490c120ca4ced7eb9a44741f0ae
          test "$(git rev-parse HEAD^{tree})" = 7e6a03566f73dc687d7f61b9f6b18a8f9e909569
          test -z "$(git status --porcelain)"
          git show -s --format='candidate_commit=%H%ncandidate_tree=%T%nparents=%P'
      - name: Install and require PDF and media test tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils ffmpeg
          command -v pdftotext
          command -v ffmpeg
          command -v ffprobe
          pdftotext -v
          ffmpeg -version
          ffprobe -version
      - name: Complete unfiltered V3 contracts
        working-directory: candidate
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/landing-home"
          export USERPROFILE="$HOME"
          export XDG_STATE_HOME="$RUNNER_TEMP/landing-state"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/landing-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/landing-data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/landing-cache"
          mkdir -p "$HOME" "$XDG_STATE_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          python -m unittest discover -s tests -p 'v3_*test.py'
      - name: Frozen development and holdout retrieval gates
        working-directory: candidate
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/eval-home"
          export USERPROFILE="$HOME"
          export XDG_STATE_HOME="$RUNNER_TEMP/eval-state"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/eval-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/eval-data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/eval-cache"
          mkdir -p "$HOME" "$XDG_STATE_HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          python scripts/evaluate_v3.py
      - name: Verify candidate remained unchanged
        working-directory: candidate
        env:
          EXPECTED_TREE: 7e6a03566f73dc687d7f61b9f6b18a8f9e909569
        run: |
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
